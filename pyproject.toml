[project]
name = "epoch-a-creative-self-efficacy"
version = "0.1.0"
description = "Reproducible machine-learning analysis of creative self-efficacy in EPOCH-A."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "ipykernel>=6.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "nbclient>=0.10",
    "nbconvert>=7.0",
    "nbformat>=5.9",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pyreadstat>=1.2",
    "python-docx>=1.1.2",
    "scikit-learn>=1.6,<2.0",
    "scipy>=1.12",
    "semopy>=2.3.11",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[tool.uv]
package = false

